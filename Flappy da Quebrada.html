const S=[{n:'a Primavera',a:'#74c3f2',b:'#dff3cf',g:'#8a7a5c'},{n:'o Verão',a:'#1f93f0',b:'#ffeaa0',g:'#a08a5a'},{n:'o Outono',a:'#d9985a',b:'#f5dca8',g:'#7d5f3f'},{n:'o Inverno',a:'#7f95ab',b:'#eaf0f6',g:'#cfd6dc'}];
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join()+')'};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const HC=['#c9573b','#d9a441','#4f8fa3','#8a6bb5','#7aa05a','#b8b0a0','#d4708a'];
function mk(n,h0,h1,w0,w1){const a=[];let p=0;for(let i=0;i<n;i++){const w=w0+rnd()*(w1-w0);a.push({x:p,w,h:h0+rnd()*(h1-h0),c:HC[Math.floor(rnd()*HC.length)],win:rnd()>.4,lit:rnd()>.5});p+=w+2+rnd()*4}return a}
const far=mk(10,60,120,44,70),near=mk(7,80,150,60,90);
const best0=(()=>{try{return +localStorage.getItem('fq')||0}catch(e){return 0}})();
let mode='ready',bird,pipes,fr,score,best=best0,sx=0,deadAt=0,banner=0,lastIdx=0,parts=[];
for(let i=0;i<40;i++)parts.push({x:rnd()*W,y:rnd()*H,s:2+rnd()*4,v:.6+rnd()*1.2,ph:rnd()*6});
function reset(){bird={y:260,vy:0};pipes=[];fr=0;score=0;lastIdx=0;banner=0}
reset();
function flap(){
 if(mode==='ready'){mode='play';bird.vy=-6.8}
 else if(mode==='play')bird.vy=-6.8;
 else if(mode==='dead'&&performance.now()-deadAt>450){reset();mode='ready'}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
function die(){mode='dead';deadAt=performance.now();if(score>best){best=score;try{localStorage.setItem('fq',best)}catch(e){}}}
function step(){
 if(mode==='ready'){sx+=1;bird.y=260+Math.sin(performance.now()/250)*8;return}
 if(mode==='dead'){bird.vy+=.5;bird.y=Math.min(GY-R,bird.y+bird.vy);return}
 fr++;sx+=2.4;bird.vy+=.42;bird.y+=bird.vy;
 const idx=Math.floor(fr/600)%4;if(idx!==lastIdx){lastIdx=idx;banner=120}if(banner>0)banner--;
 if(bird.y<R){bird.y=R;bird.vy=0}
 if(bird.y>GY-R)return die();
 const lp=pipes[pipes.length-1];
 if(!lp||lp.x<W-200)pipes.push({x:W+10,gy:90+rnd()*(GY-GAP-170),s:false});
 for(const p of pipes){p.x-=2.4;
  if(BX+R-6>p.x-5&&BX-R+6<p.x+PW+5&&(bird.y-R+6<p.gy||bird.y+R-6>p.gy+GAP))return die();
  if(!p.s&&p.x+PW<BX){p.s=true;score++}}
 if(pipes[0].x<-PW-10)pipes.shift();
}
function seasonState(){const sf=fr/600,i=Math.floor(sf)%4,f=sf%1,b=f>.85?(f-.85)/.15:0;return{i,j:(i+1)%4,b,type:b>.5?(i+1)%4:i}}
function houses(arr,off,base,haze,st,sky){
 const o=-(off%720);
 for(let k=0;k<2;k++)for(const h of arr){const hx0=o+k*720+h.x;if(hx0>W||hx0+h.w<0)continue;
  x.fillStyle=h.c;x.fillRect(hx0,base-h.h,h.w,h.h);
  x.fillStyle='#6b6b70';x.fillRect(hx0-2,base-h.h-5,h.w+4,6);
  if(st.type===3){x.fillStyle='#fff';x.fillRect(hx0-2,base-h.h-8,h.w+4,4)}
  x.fillStyle='#3a2a20';for(let r=0;r<3;r++)x.fillRect(hx0+6+r*14,base-h.h-18,2,13);
  if(h.win){x.fillStyle=h.lit?'#ffe27a':'#2b2f3a';x.fillRect(hx0+h.w*.3,base-h.h*.6,10,12)}
  x.fillStyle='#2b2220';x.fillRect(hx0+h.w*.65,base-26,12,26)}
 x.fillStyle=sky;x.globalAlpha=haze;x.fillRect(0,base-170,W,170);x.globalAlpha=1;
}
function wires(off,base){
 const o=-(off%720);x.strokeStyle='#222';x.lineWidth=1.5;
 for(let k=-1;k<2;k++){const b=o+k*720;
  x.fillStyle='#3a2f28';[80,440].forEach(px=>x.fillRect(b+px-2,base-160,4,160));
  for(let w=0;w<2;w++){x.beginPath();x.moveTo(b+80,base-150+w*8);x.quadraticCurveTo(b+260,base-110+w*8,b+440,base-150+w*8);x.quadraticCurveTo(b+620,base-110+w*8,b+800,base-150+w*8);x.stroke()}}
}
function pipeDraw(px,y0,y1,top,st){
 const g=x.createLinearGradient(px,0,px+PW,0);
 g.addColorStop(0,'#5d6b60');g.addColorStop(.35,'#9aa79a');g.addColorStop(1,'#46524a');
 x.fillStyle=g;x.fillRect(px,y0,PW,y1-y0);
 x.fillStyle='rgba(0,0,0,.25)';for(let y=y0+14;y<y1;y+=26)x.fillRect(px,y,PW,3);
 x.fillStyle='rgba(120,70,30,.35)';x.fillRect(px+10,y0,5,(y1-y0)*.6);x.fillRect(px+42,y0,4,(y1-y0)*.35);
 const ry=top?y1-26:y0;
 x.fillStyle='#7c8a7e';x.fillRect(px-6,ry,PW+12,26);
 x.fillStyle='#2e3731';x.fillRect(px-6,top?ry+22:ry,PW+12,4);
 x.fillStyle='#1d2420';for(let i=0;i<5;i++)x.fillRect(px+4+i*12,ry+7,6,12);
 if(!top&&st.type===3){x.fillStyle='#fff';x.fillRect(px-6,ry-5,PW+12,6)}
 if(!top&&st.type===0){x.fillStyle='#f7a8c4';[8,30,52].forEach(d=>{x.beginPath();x.arc(px+d,ry-2,4,0,7);x.fill()})}
 x.save();x.translate(px+PW/2+4,(y0+y1)/2);x.rotate(-Math.PI/2);x.fillStyle='rgba(255,230,60,.8)';x.font='bold 14px Impact,Arial Black,sans-serif';x.textAlign='center';x.fillText('BUEIRO DA QUEBRADA',0,0);x.restore();
}
function txt(t,px,py,sz,fill){x.font='bold '+sz+'px Impact,Haettenschweiler,Arial Black,sans-serif';x.textAlign='center';x.lineJoin='round';x.lineWidth=sz/5;x.strokeStyle='#1a1410';x.strokeText(t,px,py);x.fillStyle=fill||'#fff';x.fillText(t,px,py)}
function draw(){
 const st=seasonState(),A=S[st.i],B=S[st.j],ca=mix(A.a,B.a,st.b),cb=mix(A.b,B.b,st.b);
 const g=x.createLinearGradient(0,0,0,GY);g.addColorStop(0,ca);g.addColorStop(1,cb);x.fillStyle=g;x.fillRect(0,0,W,H);
 if(st.type===1){const rg=x.createRadialGradient(290,80,5,290,80,90);rg.addColorStop(0,'rgba(255,250,200,1)');rg.addColorStop(1,'rgba(255,230,120,0)');x.fillStyle=rg;x.fillRect(190,0,170,180)}
 houses(far,sx*.3,GY-8,.45,st,cb);wires(sx*.6,GY);houses(near,sx*.6,GY,.12,st,cb);
 for(const p of pipes){pipeDraw(p.x,0,p.gy,true,st);pipeDraw(p.x,p.gy+GAP,GY,false,st)}
 x.fillStyle=mix(A.g,B.g,st.b);x.fillRect(0,GY,W,GH);
 x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,GY,W,5);
 x.fillStyle='rgba(255,255,255,.3)';const go=-(sx%40);for(let i=0;i<10;i++)x.fillRect(go+i*40,GY+38,22,4);
 x.fillStyle='rgba(60,90,110,.55)';x.beginPath();x.ellipse(((250-sx)%520+520)%520-80,GY+22,38,6,0,0,7);x.fill();
 for(const p of parts){
  if(mode!=='dead'){p.ph+=.04;p.y+=p.v*(st.type===3?1:st.type===1?.15:.9);p.x+=Math.sin(p.ph)*.7-(mode==='play'?.7:.2)}
  if(p.y>GY)p.y=-6;if(p.x<-8)p.x=W+8;
  const t=st.type;
  if(t===0){x.fillStyle='#f7a8c4';x.beginPath();x.ellipse(p.x,p.y,p.s,p.s*.6,p.ph,0,7);x.fill()}
  else if(t===1){x.fillStyle='rgba(255,240,150,.6)';x.fillRect(p.x,p.y*.8,2,2)}
  else if(t===2){x.fillStyle=p.s>4?'#c4561f':'#e0a030';x.beginPath();x.ellipse(p.x,p.y,p.s+1,p.s*.55,p.ph,0,7);x.fill()}
  else{x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,p.s*.5,0,7);x.fill()}}
 x.save();x.translate(BX,bird.y);x.rotate(Math.max(-.5,Math.min(1.1,bird.vy*.06)));
 x.beginPath();x.arc(0,0,R+2,0,7);x.fillStyle='#fff';x.fill();
 x.beginPath();x.arc(0,0,R,0,7);x.clip();
 if(img.complete&&img.naturalWidth)x.drawImage(img,-R-4,-R-4,2*R+8,2*R+8);else{x.fillStyle='#222';x.fill()}
 x.restore();
 if(mode!=='ready')txt(score,W/2,80,56);
 if(banner>0){x.globalAlpha=Math.min(1,banner/30);txt('Chegou '+S[lastIdx].n+'!',W/2,130,24,'#ffe45c');x.globalAlpha=1}
 if(mode==='ready'){txt('FLAPPY DA QUEBRADA',W/2,150,34,'#ffe45c');txt('Toque pra voar',W/2,GY-60,22)}
 if(mode==='dead'){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(40,190,W-80,200);
  txt('BATEU NO BUEIRO!',W/2,240,28,'#ff6a4d');txt('Placar: '+score,W/2,290,26);txt('Recorde: '+best,W/2,328,22,'#ffe45c');txt('Toque pra tentar de novo',W/2,368,16)}
}
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(100,n-last);last=n;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
